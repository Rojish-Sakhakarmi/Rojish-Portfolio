<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rojish Sakhakarmi — Brand, Systems & Markets</title>
  <meta name="description" content="Personal portfolio of Rojish Sakhakarmi. Notes on brand, marketing, design, systems, and market discipline.">
  <meta name="author" content="Rojish Sakhakarmi">
  <meta property="og:title" content="Rojish Sakhakarmi">
  <meta property="og:description" content="I think about brands, people and markets.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0a0a">

  <!-- Favicon: Clean Ink-Square Icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0a0a'/><path d='M8 12 L16 8 L24 12 L16 16 Z M8 17 L16 21 L24 17 M8 22 L16 26 L24 22' stroke='%23ffffff' stroke-width='2' fill='none' stroke-linejoin='round'/></svg>">

  <!-- Typography: Geist with Helvetica and system-ui fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       THEME VARIABLES & COLOR TOKENS
       Strict Minimal Monochrome (#000 & #fff, subtle charcoal & neutral grays)
       ========================================================================== */
    :root {
      --bg: #ffffff;
      --bg-subtle: #f9f9fa;
      --bg-card: #ffffff;
      --bg-hover: #f4f4f6;
      --text: #0a0a0a;
      --text-muted: #52525b;
      --text-subtle: #71717a;
      --border: #e4e4e7;
      --border-dark: #18181b;
      --pill-bg: #f4f4f5;
      --doodle: #18181b;
      --progress-bg: #0a0a0a;
      --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
      --font-sans: 'Geist', 'Helvetica Neue', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-hand: 'Caveat', cursive, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #09090b;
      --bg-subtle: #121215;
      --bg-card: #111114;
      --bg-hover: #18181c;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --text-subtle: #71717a;
      --border: #27272a;
      --border-dark: #fafafa;
      --pill-bg: #18181b;
      --doodle: #f4f4f5;
      --progress-bg: #ffffff;
      --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    /* CSS Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
      color: var(--text);
    }

    body {
      font-family: var(--font-sans);
      font-size: 17px;
      line-height: 1.6;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
      color: inherit;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* ==========================================================================
       CONTAINERS & COMMON UTILITIES
       ========================================================================== */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 28px;
    }

    .section-spacing {
      padding: 108px 0;
      position: relative;
    }

    .divider {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 0;
    }

    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background-color: var(--progress-bg);
      z-index: 1000;
      transition: width 0.1s ease-out;
    }

    /* Handwritten Accent Note */
    .hand-note {
      font-family: var(--font-hand);
      font-size: 20px;
      color: var(--text-subtle);
      line-height: 1.2;
      display: inline-block;
      user-select: none;
    }

    /* ==========================================================================
       HEADER & NAVIGATION
       ========================================================================== */
    header {
      position: sticky;
      top: 0;
      background: rgba(var(--bg), 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      z-index: 900;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 74px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -0.02em;
    }

    .logo-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid var(--border);
      background-color: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-link {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-muted);
      position: relative;
      padding: 6px 0;
      transition: color 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 1px;
      background-color: var(--text);
      transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      width: 100%;
    }

    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 9999px;
      background: var(--bg-card);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .theme-toggle-btn:hover {
      border-color: var(--text);
      transform: scale(1.03);
    }

    /* ==========================================================================
       BUTTONS & PILLS
       ========================================================================== */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background-color: var(--pill-bg);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--text);
      display: inline-block;
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.75); }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
      white-space: nowrap;
      position: relative;
    }

    .btn-solid {
      background-color: var(--text);
      color: var(--bg);
      border: 1px solid var(--text);
    }

    .btn-solid:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--text);
      border: 1px solid var(--border-dark);
    }

    .btn-outline:hover {
      background-color: var(--pill-bg);
      transform: translateY(-1px);
    }

    .btn-arrow {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .btn:hover .btn-arrow {
      transform: translateX(4px);
    }

    /* ==========================================================================
       HERO SECTION WITH DOODLES & ART
       ========================================================================== */
    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 56px;
      padding: 90px 0 80px 0;
    }

    .hero-content {
      position: relative;
    }

    .hero-headline-wrap {
      margin: 22px 0 20px 0;
      position: relative;
    }

    .headline-line {
      font-size: clamp(38px, 5.2vw, 64px);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.04em;
      display: block;
    }

    /* Hand-drawn underline doodle for the word 'brands' */
    .doodle-underline {
      position: relative;
      display: inline-block;
    }

    .doodle-underline svg {
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 100%;
      height: 14px;
      overflow: visible;
      stroke: var(--doodle);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .hero-subtext {
      font-size: 19px;
      line-height: 1.55;
      color: var(--text-muted);
      max-width: 580px;
      margin-bottom: 34px;
      letter-spacing: -0.01em;
    }

    .hero-buttons {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }

    .hero-socials {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 14px;
      color: var(--text-subtle);
    }

    .hero-socials a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .hero-socials a:hover {
      color: var(--text);
    }

    /* Cool Line Art / Human Sketch Card */
    .hero-art-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .hero-art-card:hover {
      border-color: var(--text);
      transform: translateY(-3px);
    }

    .sketch-human-illustration {
      width: 100%;
      max-width: 320px;
      height: auto;
      stroke: var(--doodle);
      fill: none;
      animation: gentleFloat 6s ease-in-out infinite;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .art-badge {
      margin-top: 18px;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px dashed var(--border);
      background: var(--bg-subtle);
      font-family: var(--font-hand);
      font-size: 17px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Floating mini doodles around art */
    .float-doodle {
      position: absolute;
      stroke: var(--doodle);
      fill: none;
      pointer-events: none;
    }

    /* ==========================================================================
       TICKER (SCROLLING STRIP)
       ========================================================================== */
    .ticker-wrap {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      padding: 16px 0;
      white-space: nowrap;
      user-select: none;
      background: var(--bg-subtle);
    }

    .ticker-inner {
      display: inline-flex;
      animation: tickerRoll 24s linear infinite;
    }

    .ticker-wrap:hover .ticker-inner {
      animation-play-state: paused;
    }

    .ticker-item {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0 32px;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 16px;
    }

    .ticker-star {
      display: inline-block;
      font-size: 11px;
      opacity: 0.6;
    }

    @keyframes tickerRoll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ==========================================================================
       DISCIPLINE LESSONS (WITH SKETCH ICONS)
       ========================================================================== */
    .section-title {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .discipline-grid {
      display: grid;
      grid-template-columns: 1fr;
      border-top: 1px solid var(--border);
    }

    .discipline-row {
      display: grid;
      grid-template-columns: 280px 1fr auto;
      align-items: center;
      gap: 24px;
      padding: 24px 8px;
      border-bottom: 1px solid var(--border);
      transition: all 0.2s ease;
      position: relative;
    }

    .discipline-row:hover {
      background: var(--bg-hover);
      padding-left: 18px;
      padding-right: 18px;
      border-radius: 12px;
    }

    .discipline-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .discipline-sketch-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      stroke: var(--doodle);
      fill: none;
      transition: transform 0.2s ease;
    }

    .discipline-row:hover .discipline-sketch-icon {
      transform: scale(1.1) rotate(-4deg);
      border-color: var(--text);
    }

    .discipline-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .discipline-lesson {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* ==========================================================================
       BLOG & ESSAYS
       ========================================================================== */
    .post-row {
      display: grid;
      grid-template-columns: 140px 1fr auto;
      align-items: baseline;
      gap: 24px;
      padding: 24px 8px;
      border-bottom: 1px solid var(--border);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .post-row:first-of-type {
      border-top: 1px solid var(--border);
    }

    .post-row:hover {
      background: var(--bg-hover);
      padding-left: 16px;
      padding-right: 16px;
      border-radius: 12px;
    }

    .post-row:hover .row-arrow {
      transform: translateX(4px);
    }

    .post-date {
      font-size: 14px;
      color: var(--text-subtle);
      font-variant-numeric: tabular-nums;
    }

    .post-main {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .post-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .post-summary {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .post-meta-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .category-chip {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 9999px;
      background-color: var(--pill-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .row-arrow {
      font-size: 16px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    /* Blog Controls */
    .blog-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .filter-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      color: var(--text);
      border-color: var(--text);
    }

    .filter-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .search-box {
      font-family: inherit;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      width: 240px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-box:focus {
      border-color: var(--text);
    }

    .empty-state {
      padding: 64px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 16px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    /* Single Post View */
    .post-column {
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 0 80px 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 36px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--text);
    }

    .post-view-title {
      font-size: clamp(32px, 4.5vw, 44px);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .post-view-meta {
      font-size: 14px;
      color: var(--text-subtle);
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      letter-spacing: -0.01em;
    }

    .post-content p {
      font-size: 19px;
      line-height: 1.7;
      color: var(--text);
      margin-bottom: 24px;
    }

    .trading-disclaimer {
      font-size: 14px;
      font-style: italic;
      color: var(--text-subtle);
      border-left: 2px solid var(--border);
      padding-left: 14px;
      margin: 24px 0;
    }

    .post-footer-nav {
      margin-top: 56px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

    /* ==========================================================================
       ABOUT VIEW (#about) WITH PHOTO & SKETCH TAPE
       ========================================================================== */
    .about-layout {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 56px;
      align-items: start;
    }

    .lead-text {
      font-size: clamp(22px, 3vw, 29px);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
      color: var(--text);
    }

    .body-copy {
      font-size: 17px;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 20px;
    }

    .at-a-glance-table {
      width: 100%;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    .glance-row {
      display: grid;
      grid-template-columns: 180px 1fr;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      font-size: 16px;
    }

    .glance-label {
      font-weight: 500;
      color: var(--text-subtle);
    }

    .glance-value {
      font-weight: 500;
      color: var(--text);
    }

    /* Polaroid / Framed Photo with Hand-drawn Washi Tape */
    .profile-photo-frame {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--card-shadow);
      text-align: center;
    }

    .washi-tape {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 110px;
      height: 24px;
      background: var(--pill-bg);
      border: 1px dashed var(--border);
      z-index: 2;
      opacity: 0.9;
    }

    .photo-inner {
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      background-color: var(--bg-subtle);
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .photo-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(1.05);
      transition: filter 0.3s ease, transform 0.3s ease;
    }

    .photo-inner:hover img {
      filter: grayscale(0%);
      transform: scale(1.02);
    }

    .photo-caption {
      font-family: var(--font-hand);
      font-size: 19px;
      color: var(--text-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* ==========================================================================
       CONTACT CTA BAND WITH PAPER AIRPLANE DOODLE
       ========================================================================== */
    .contact-band {
      border-top: 1px solid var(--border);
      padding: 96px 0;
      position: relative;
      overflow: hidden;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      gap: 40px;
    }

    .contact-headline {
      font-size: clamp(30px, 4vw, 44px);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .contact-subtext {
      font-size: 17px;
      color: var(--text-muted);
      margin-bottom: 28px;
      max-width: 520px;
    }

    .contact-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .copy-pill-btn {
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 9999px;
      border: 1px solid var(--border);

        month: 'short',

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeText.textContent = 'Light';
      } else {
        document.documentElement.removeAttribute('data-theme');
        themeText.textContent = 'Dark';

      const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

      if (!localStorage.getItem('theme')) {

                  <div class="discipline-sketch-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                      <!-- Pen tool & palette sketch -->
                      <path d="M12 19l7-7 3 3-7 7-3-3z" stroke-width="1.8"/>
                      <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18" stroke-width="1.8"/>
                      <circle cx="11" cy="11" r="2" stroke-width="1.6"/>
                    </svg>
                  </div>
                  <div class="discipline-title">Graphic design</div>
                </div>
                <div class="discipline-lesson">
                  Consistency builds trust. Spacing, type and colour set how a brand feels before a word is read.
                </div>
              </div>

              <!-- UI/UX -->
              <div class="discipline-row">
                <div class="discipline-left">
                  <div class="discipline-sketch-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                      <!-- Interface Wireframe doodle -->
                      <rect x="3" y="3" width="18" height="18" rx="3" stroke-width="1.8"/>
                      <line x1="3" y1="9" x2="21" y2="9" stroke-width="1.6"/>
                      <line x1="9" y1="21" x2="9" y2="9" stroke-width="1.6"/>
                    </svg>
                  </div>
                  <div class="discipline-title">UI/UX</div>
                </div>
                <div class="discipline-lesson">
                  Good design removes effort. If people hesitate, the design has more work to do.
                </div>
              </div>

              <!-- Information Technology -->
              <div class="discipline-row">
                <div class="discipline-left">
                  <div class="discipline-sketch-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                      <!-- Node System / Code bracket doodle -->
                      <polyline points="16 18 22 12 16 6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                      <polyline points="8 6 2 12 8 18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                      <line x1="14" y1="4" x2="10" y2="20" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                  </div>
                  <div class="discipline-title">Information technology</div>
                </div>
                <div class="discipline-lesson">
                  Systems fail at the edges. Simple tools that people understand beat clever ones they cannot maintain.
                </div>
              </div>

              <!-- Trading -->
              <div class="discipline-row">
                <div class="discipline-left">
                  <div class="discipline-sketch-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                      <!-- Candlestick chart sketch -->
                      <line x1="6" y1="3" x2="6" y2="21" stroke-width="1.5"/>
                      <rect x="4" y="7" width="4" height="8" stroke-width="1.6" fill="currentColor"/>
                      <line x1="18" y1="3" x2="18" y2="21" stroke-width="1.5"/>
                      <rect x="16" y="9" width="4" height="9" stroke-width="1.6"/>
                    </svg>
                  </div>
                  <div class="discipline-title">Trading</div>
                </div>
                <div class="discipline-lesson">
                  Being right matters less than managing risk. Discipline and patience compound; impulse does not.
                </div>
              </div>

            </div>
          </div>
        </section>

        <!-- Latest Writing -->
        <section class="section-spacing" style="padding-top: 0;">
          <div class="container">
            <div class="section-title">
              <span>Latest writing</span>
              <a href="#blog" class="btn btn-outline" style="font-size: 14px; padding: 6px 16px;">
                <span>All notes</span>
                <span class="btn-arrow">→</span>
              </a>
            </div>

            <div class="posts-list">
              ${postRows}
            </div>
          </div>
        </section>

        ${renderContactBand()}
      `;
    }

    // 2. ABOUT VIEW (WITH FRAMED PROFILE PHOTO & ANNOTATIONS)
    function renderAbout() {
      return `
        <article class="section-spacing">
          <div class="container">
            <h1 class="section-title" style="font-size: clamp(34px, 5vw, 48px); margin-bottom: 48px;">
              <span>About</span>
              <span class="hand-note">philosophy & path ✦</span>
            </h1>

            <div class="about-layout">
              
              <!-- Left: Narrative -->
              <div>
                <section style="margin-bottom: 56px;">
                  <h2 style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); margin-bottom: 16px;">The short version</h2>
                  <p class="lead-text">
                    I'm a Nepal-based professional with a background in information technology and a trader's discipline, focused on how brands grow and how people make decisions.
                  </p>
                  <p class="body-copy">
                    Technology gave me a way of thinking about systems. Marketing, sales and design showed me how people respond to them. Trading showed me how I respond under pressure.
                  </p>
                </section>

                <section style="margin-bottom: 56px;">
                  <h2 style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); margin-bottom: 20px;">How I got here</h2>
                  <p class="body-copy">
                    I started with technology because I wanted to understand how things are built. Along the way I became interested in why some brands stick and others disappear, which led me to marketing, sales and graphic design.
                  </p>
                  <p class="body-copy">
                    Trading came from wanting to understand money and risk first-hand. It rewards patience and punishes ego, and it keeps me honest about what I know.
                  </p>
                  <p class="body-copy">
                    Today I bring all of it to one question: what makes people trust a brand, choose it, and stay.
                  </p>
                </section>

                <section>
                  <h2 style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); margin-bottom: 16px;">At a glance</h2>
                  <div class="at-a-glance-table">
                    <div class="glance-row">
                      <div class="glance-label">Based in</div>
                      <div class="glance-value">Nepal</div>
                    </div>
                    <div class="glance-row">
                      <div class="glance-label">Background</div>
                      <div class="glance-value">Information technology</div>
                    </div>
                    <div class="glance-row">
                      <div class="glance-label">Interests</div>
                      <div class="glance-value">Marketing, sales, design, markets</div>
                    </div>
                    <div class="glance-row">
                      <div class="glance-label">Open to</div>
                      <div class="glance-value">Conversations and collaborations</div>
                    </div>
                  </div>

                  <a href="/Rojish_Resume.pdf" target="_blank" rel="noopener noreferrer" class="btn btn-outline">
                    <span>Download resume</span>
                    <span class="btn-arrow">→</span>
                  </a>
                </section>
              </div>

              <!-- Right: Framed Portrait with Sketched Washi Tape & Hand-drawn arrow -->
              <div style="position: sticky; top: 110px;">
                <div class="profile-photo-frame">
                  <div class="washi-tape"></div>
                  <div class="photo-inner">
                    <img src="/images/profile.jpg" alt="Rojish Sakhakarmi" onerror="this.onerror=null; this.src='profile.jpg';" />
                  </div>
                  <div class="photo-caption">
                    <span>✦ Rojish Sakhakarmi</span>
                  </div>
                  <div class="hand-note" style="font-size: 17px; margin-top: 8px; color: var(--text-subtle);">
                    Bhaktapur, Nepal
                  </div>
                </div>

                <!-- Sketch arrow pointing up to photo -->
                <div style="margin-top: 24px; text-align: center;" aria-hidden="true">
                  <svg width="180" height="60" viewBox="0 0 180 60" style="stroke: var(--doodle); fill: none;">
                    <path d="M 20 45 C 50 55, 90 40, 110 20" stroke-width="1.8" stroke-dasharray="3 3"/>
                    <polyline points="102,18 112,18 112,28" stroke-width="1.8"/>
                    <text x="10" y="25" font-family="'Caveat', cursive" font-size="19" fill="currentColor">practical mindset</text>
                  </svg>
                </div>
              </div>

            </div>
          </div>
        </article>

        ${renderContactBand()}
      `;
    }

    // 3. BLOG VIEW (CATEGORY FILTER + SEARCH)
    let currentCategory = "All";
    let currentSearch = "";

    function renderBlog() {
      const categories = ["All", ...Array.from(new Set(BLOG_POSTS.map(p => p.category)))];

      const filtered = BLOG_POSTS.filter(post => {
        const matchesCategory = currentCategory === "All" || post.category === currentCategory;
        const q = currentSearch.toLowerCase().trim();
        const matchesSearch = !q ||
          post.title.toLowerCase().includes(q) ||
          post.excerpt.toLowerCase().includes(q) ||
          post.body.join(' ').toLowerCase().includes(q);
        return matchesCategory && matchesSearch;
      });

      const chipsHtml = categories.map(cat => `
        <button class="filter-btn ${cat === currentCategory ? 'active' : ''}" onclick="setBlogCategory('${escapeHtml(cat)}')">
          ${escapeHtml(cat)}
        </button>
      `).join('');

      let contentHtml = '';
      if (filtered.length === 0) {
        contentHtml = `<div class="empty-state">No posts match that yet.</div>`;
      } else {
        contentHtml = filtered.map(post => `
          <div class="post-row" onclick="location.hash='#post/${escapeHtml(post.slug)}'">
            <div class="post-date">${escapeHtml(formatDate(post.date))}</div>
            <div class="post-main">
              <h3 class="post-title">${escapeHtml(post.title)}</h3>
              <p class="post-summary">${escapeHtml(post.excerpt)}</p>
            </div>
            <div class="post-meta-right">
              <span class="category-chip">${escapeHtml(post.category)}</span>
              <span class="row-arrow">→</span>
            </div>
          </div>
        `).join('');
      }

      return `
        <section class="section-spacing">
          <div class="container">
            <div class="section-title" style="margin-bottom: 8px;">
              <span>Blog</span>
              <span class="hand-note">reflections & field notes ✦</span>
            </div>
            <p class="hero-subtext" style="margin-bottom: 44px;">Notes on brand, sales, design, technology and markets.</p>

            <div class="blog-controls">
              <div class="filter-chips">
                ${chipsHtml}
              </div>
              <input
                type="search"
                class="search-box"
                id="blog-search-input"
                placeholder="Search essays (press / to focus)..."
                value="${escapeHtml(currentSearch)}"
                oninput="handleBlogSearch(this.value)"
                aria-label="Search essays"
              />
            </div>

            <div class="posts-list" id="blog-posts-container">
              ${contentHtml}
            </div>
          </div>
        </section>

        ${renderContactBand()}
      `;
    }

    window.setBlogCategory = function(cat) {
      currentCategory = cat;
      const app = document.getElementById('app');
      app.innerHTML = renderBlog();
      const input = document.getElementById('blog-search-input');
      if (input && currentSearch) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    };

    window.handleBlogSearch = function(val) {
      currentSearch = val;
      const filtered = BLOG_POSTS.filter(post => {
        const matchesCategory = currentCategory === "All" || post.category === currentCategory;
        const q = currentSearch.toLowerCase().trim();
        const matchesSearch = !q ||
          post.title.toLowerCase().includes(q) ||
          post.excerpt.toLowerCase().includes(q) ||
          post.body.join(' ').toLowerCase().includes(q);
        return matchesCategory && matchesSearch;
      });

      const container = document.getElementById('blog-posts-container');
      if (!container) return;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">No posts match that yet.</div>`;
      } else {
        container.innerHTML = filtered.map(post => `
          <div class="post-row" onclick="location.hash='#post/${escapeHtml(post.slug)}'">
            <div class="post-date">${escapeHtml(formatDate(post.date))}</div>
            <div class="post-main">
              <h3 class="post-title">${escapeHtml(post.title)}</h3>
              <p class="post-summary">${escapeHtml(post.excerpt)}</p>
            </div>
            <div class="post-meta-right">
              <span class="category-chip">${escapeHtml(post.category)}</span>
              <span class="row-arrow">→</span>
            </div>
          </div>
        `).join('');
      }
    };

    // 4. POST VIEW (#post/slug)
    function renderPost(slug) {
      const index = BLOG_POSTS.findIndex(p => p.slug === slug);
      if (index === -1) {
        return `
          <div class="container section-spacing" style="text-align: center;">
            <h1 class="section-title" style="justify-content: center;">Post not found</h1>
            <p class="hero-subtext" style="margin: 0 auto 32px auto;">The post you are looking for does not exist or has been moved.</p>
            <a href="#blog" class="btn btn-solid">
              <span class="btn-arrow" style="transform: rotate(180deg); display: inline-block;">→</span>
              <span>Back to blog</span>
            </a>
          </div>
          ${renderContactBand()}
        `;
      }

      const post = BLOG_POSTS[index];
      const nextPost = BLOG_POSTS[(index + 1) % BLOG_POSTS.length];
      const readingTime = calculateReadingTime(post.body);
      const paragraphsHtml = post.body.map(p => `<p>${escapeHtml(p)}</p>`).join('');

      return `
        <article class="container">
          <div class="post-column">
            <a href="#blog" class="back-link">
              <span class="btn-arrow" style="transform: rotate(180deg); display: inline-block;">→</span>
              <span>Back to blog</span>
            </a>

            <h1 class="post-view-title">${escapeHtml(post.title)}</h1>

            <div class="post-view-meta">
              ${escapeHtml(post.category)} · ${escapeHtml(formatMonthYear(post.date))} · ${readingTime}
            </div>

            <div class="post-content">
              ${paragraphsHtml}
            </div>

            ${post.category === 'Markets' ? `<div class="trading-disclaimer">Note: This is my personal experience, not financial advice.</div>` : ''}

            <div class="post-footer-nav">
              <a href="#post/${escapeHtml(nextPost.slug)}" class="btn btn-outline">
                <span>Next: ${escapeHtml(nextPost.title)}</span>
                <span class="btn-arrow">→</span>
              </a>
            </div>
          </div>
        </article>

        ${renderContactBand()}
      `;
    }

    // =========================================================================
    // READING PROGRESS BAR LOGIC
    // =========================================================================
    const progressBar = document.getElementById('progress-bar');

    window.addEventListener('scroll', () => {
      const hash = window.location.hash;
      if (hash.startsWith('#post/')) {
        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        if (docHeight > 0) {
          const progress = (scrollTop / docHeight) * 100;
          progressBar.style.width = Math.min(progress, 100) + '%';
        }
      } else {
        progressBar.style.width = '0%';
      }
    });

    // Keyboard shortcut to search
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.getElementById('blog-search-input')) {
        const input = document.getElementById('blog-search-input');
        if (document.activeElement !== input) {
          e.preventDefault();
          input.focus();
        }
      }
      if (e.key === 'Escape' && document.getElementById('blog-search-input')) {
        const input = document.getElementById('blog-search-input');
        input.value = '';
        handleBlogSearch('');
        input.blur();
      }
    });

    // =========================================================================
    // HASH ROUTER
    // =========================================================================
    function handleRoute() {
      const hash = window.location.hash || '';
      const app = document.getElementById('app');

      document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));

      if (hash === '#contact') {
        if (!document.getElementById('contact-band')) {
          app.innerHTML = renderHome();
        }
        document.getElementById('nav-contact').classList.add('active');
        document.title = "Rojish Sakhakarmi";
        progressBar.style.width = '0%';
        const contactBand = document.getElementById('contact-band');
        if (contactBand) {
          contactBand.scrollIntoView({ behavior: 'smooth' });
        }
        return;
      }

      window.scrollTo(0, 0);
      progressBar.style.width = '0%';

      if (hash === '#about') {
        document.getElementById('nav-about').classList.add('active');
        app.innerHTML = renderAbout();
        document.title = "About — Rojish Sakhakarmi";
      } else if (hash === '#blog') {
        document.getElementById('nav-blog').classList.add('active');
        app.innerHTML = renderBlog();
        document.title = "Blog — Rojish Sakhakarmi";
      } else if (hash.startsWith('#post/')) {
        const slug = hash.replace('#post/', '').trim();
        app.innerHTML = renderPost(slug);
        const post = BLOG_POSTS.find(p => p.slug === slug);
        if (post) {
          document.title = `${post.title} — Rojish Sakhakarmi`;
        } else {
          document.title = "Post not found — Rojish Sakhakarmi";
        }
      } else {
        app.innerHTML = renderHome();
        document.title = "Rojish Sakhakarmi";
      }
    }

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('DOMContentLoaded', handleRoute);
  </script>
</body>
</html>
