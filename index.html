<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rojish Sakhakarmi — Business Development & Strategy</title>
  <meta name="description" content="Personal portfolio of Rojish Sakhakarmi. Business Development Officer specializing in brand strategy, international client outreach, and market positioning.">
  <meta name="author" content="Rojish Sakhakarmi">
  <meta property="og:title" content="Rojish Sakhakarmi — Business Development & Strategy">
  <meta property="og:description" content="Where strategy, creativity, and communication meet.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0a0a">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0a0a'/><text x='16' y='21' font-family='monospace' font-size='14' font-weight='bold' fill='%23ffffff' text-anchor='middle'>RS</text></svg>">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --bg-subtle: #f8f8fa;
      --bg-card: #ffffff;
      --bg-hover: #f3f3f5;
      --text: #0a0a0a;
      --text-muted: #52525b;
      --text-subtle: #71717a;
      --border: #e4e4e7;
      --border-dark: #18181b;
      --pill-bg: #f4f4f5;
      --progress-bg: #0a0a0a;
      --card-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.06);
      --font-sans: 'Geist', 'Helvetica Neue', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="dark"] {
      --bg: #09090b;
      --bg-subtle: #121215;
      --bg-card: #111114;
      --bg-hover: #18181c;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --text-subtle: #71717a;
      --border: #27272a;
      --border-dark: #fafafa;
      --pill-bg: #18181b;
      --progress-bg: #ffffff;
      --card-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.5);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
      color: var(--text);
    }

    body {
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px;
    }

    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background-color: var(--progress-bg);
      z-index: 1000;
      transition: width 0.1s ease-out;
    }

    .font-mono {
      font-family: var(--font-mono);
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(var(--bg), 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 900;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .logo-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--pill-bg);
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-link {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      position: relative;
      padding: 4px 0;
      transition: color 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 1px;
      background-color: var(--text);
      transition: width 0.2s ease;
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      width: 100%;
    }

    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 9999px;
      background: var(--bg-card);
      cursor: pointer;
      color: inherit;
      transition: border-color 0.2s ease;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 9999px;
      background-color: var(--pill-bg);
      font-size: 12px;
      font-family: var(--font-mono);
      border: 1px solid var(--border);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10b981;
      display: inline-block;
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.75); }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      white-space: nowrap;
      cursor: pointer;
    }

    .btn-solid {
      background-color: var(--text);
      color: var(--bg);
      border: 1px solid var(--text);
    }

    .btn-solid:hover {
      opacity: 0.9;
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border-dark);
    }

    .btn-outline:hover {
      background-color: var(--pill-bg);
    }

    .hero-section {
      padding: 48px 0 40px 0;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.85fr;
      gap: 48px;
      align-items: center;
    }

    .hero-headline-wrap {
      font-size: clamp(34px, 5.2vw, 56px);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin: 20px 0;
    }

    .hero-headline-wrap span {
      display: block;
    }

    .hero-subtext {
      font-size: 17px;
      color: var(--text-muted);
      max-width: 540px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .hero-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .hero-socials {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-subtle);
    }

    .hero-socials a:hover {
      color: var(--text);
    }

    .hero-art-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .hero-art-card:hover {
      border-color: var(--text);
      transform: translateY(-2px);
    }

    .art-tech-header, .art-tech-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-subtle);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .art-tech-footer {
      border-bottom: none;
      border-top: 1px solid var(--border);
      padding-top: 8px;
      padding-bottom: 0;
      margin-top: 16px;
      margin-bottom: 0;
    }

    .capabilities-wrap {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-subtle);
      padding: 32px 0;
      margin: 20px 0 48px 0;
    }

    .capabilities-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }

    .capability-card {
      border-left: 2px solid var(--border-dark);
      padding-left: 16px;
    }

    .capability-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-subtle);
      margin-bottom: 4px;
    }

    .capability-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .capability-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .section-spacing {
      padding: 48px 0;
    }

    .section-title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .discipline-grid {
      border-top: 1px solid var(--border);
    }

    .discipline-row {
      display: grid;
      grid-template-columns: 260px 1fr;
      align-items: baseline;
      gap: 20px;
      padding: 18px 8px;
      border-bottom: 1px solid var(--border);
      transition: background-color 0.15s ease, padding-left 0.15s ease;
    }

    .discipline-row:hover {
      background: var(--bg-hover);
      padding-left: 14px;
      border-radius: 8px;
    }

    .discipline-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .discipline-lesson {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .post-row {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      align-items: baseline;
      gap: 20px;
      padding: 18px 8px;
      border-bottom: 1px solid var(--border);
      transition: background-color 0.15s ease, padding-left 0.15s ease;
      cursor: pointer;
    }

    .post-row:first-of-type {
      border-top: 1px solid var(--border);
    }

    .post-row:hover {
      background: var(--bg-hover);
      padding-left: 14px;
      border-radius: 8px;
    }

    .post-date {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-subtle);
    }

    .post-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .post-summary {
      font-size: 14px;
      color: var(--text-muted);
    }

    .category-chip {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: var(--pill-bg);
      color: var(--text-muted);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .contact-layout {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 32px;
      align-items: start;
    }

    .contact-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--card-shadow);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      color: var(--text-subtle);
      margin-bottom: 6px;
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--text);
    }

    .form-textarea {
      resize: none;
      min-height: 110px;
    }

    .shared-contact-band {
      border-top: 1px solid var(--border);
      padding: 48px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 24px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 24px 0;
      font-size: 13px;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .footer-links a:hover {
      color: var(--text);
    }

    .toast-pill {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text);
      color: var(--bg);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-family: var(--font-mono);
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.2s ease;
      z-index: 1000;
    }

    .toast-pill.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 860px) {
      .hero-grid {
        grid-template-columns: 1fr;
        gap: 32px;
        padding: 30px 0;
      }
      .contact-layout {
        grid-template-columns: 1fr;
      }
      .discipline-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .post-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <div id="progress-bar"></div>

  <!-- Header -->
  <header>
    <div class="container">
      <div class="header-inner">
        <a href="#" class="logo-wrap" id="logo-link">
          <span class="logo-badge">RS</span>
          <span>Rojish Sakhakarmi</span>
        </a>

        <nav class="nav-group" aria-label="Main Navigation">
          <a href="#about" class="nav-link" id="nav-about">About</a>
          <a href="#blog" class="nav-link" id="nav-blog">Writing</a>
          <a href="#contact" class="nav-link" id="nav-contact">Contact</a>
          <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle theme">
            <span id="theme-text">Dark</span>
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- Router Mount -->
  <main id="app" class="container"></main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-inner">
        <div>© 2026 Rojish Sakhakarmi — Bhaktapur, Nepal</div>
        <div class="footer-links">
          <a href="https://linkedin.com/in/rojish0" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="https://instagram.com/rojish0" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a href="/admin" target="_blank" rel="noopener noreferrer">Admin CMS ↗</a>
        </div>
      </div>
    </div>
  </footer>

  <div class="toast-pill" id="toast">Copied email to clipboard!</div>

  <script>
    const BLOG_POSTS = [
      {
        slug: "why-creativity-needs-strategy",
        title: "Why creativity becomes truly valuable only when backed by strategy",
        category: "Brand Strategy",
        date: "2026-09-15",
        excerpt: "Making things look good is only half the work. True creative impact comes from understanding why a brand exists, who it serves, and the business problem it solves.",
        body: [
          "In graphic design and branding, it is easy to get caught up in aesthetic trends, colors, and typography. But over time, working across both creative design and business development, I realized that aesthetics without strategy rarely produce lasting business value.",
          "Good design catches attention, but strategic positioning builds trust. Before sketching a logo or planning a website layout, you have to ask the fundamental commercial questions: What specific problem are we solving? What expectation are we setting in the client's mind? And can the business consistently deliver on that expectation?",
          "When creativity is anchored to a clear business objective, design stops being a decorative expense and becomes a powerful commercial asset. It communicates value before a word is read and removes friction for the decision-maker."
        ]
      },
      {
        slug: "international-client-outreach",
        title: "What international client outreach taught me about business development",
        category: "Business Development",
        date: "2026-08-20",
        excerpt: "Notes from lead generation and client communication at WebX Nepal. Why listening and understanding client requirements beats high-pressure pitches.",
        body: [
          "Stepping into business development at WebX Nepal, I was tasked with international outreach, lead generation, and digital positioning. Coming in with a design and IT background, I initially wondered how much persuasion would be required.",
          "What I quickly discovered was that effective business development is not about aggressive selling. It is about careful research, active listening, and diagnosing what a prospective partner actually needs before proposing a digital solution.",
          "When you take the time to understand a client's workflows, target audience, and current bottlenecks, the commercial proposal almost writes itself. Genuine communication and clear expectations build partnerships that last."
        ]
      },
      {
        slug: "teaching-financial-markets",
        title: "What educating others on financial markets taught me about risk and patience",
        category: "Financial Markets",
        date: "2026-07-10",
        excerpt: "Observing the stock and forex markets rewards emotional discipline over impulse. Teaching financial literacy showed me how human psychology drives decision-making.",
        body: [
          "My fascination with the financial markets—from stock investing to forex—began with a simple curiosity about how capital flows and how market participants react to uncertainty. In trading, you quickly learn that being right matters far less than managing downside risk.",
          "When I started teaching and educating others about financial literacy and market fundamentals, I noticed that the hardest lesson is rarely technical analysis—it is emotional discipline. Most beginners lose money not because of bad charts, but because of impatience and ego.",
          "Whether in the markets or in business negotiations, patience is an active position. Managing risk, preserving resources, and waiting for high-probability setups will always compound better than chasing restless impulses. (This reflects personal experience, not financial advice.)"
        ]
      },
      {
        slug: "systems-thinking-from-it",
        title: "How an IT background in cybersecurity shapes business thinking",
        category: "Systems & Tech",
        date: "2026-06-05",
        excerpt: "Studying Computer Science and networking at KFA Business School gave me a framework for diagnosing friction and understanding how systems behave under pressure.",
        body: [
          "Completing my Bachelor's in Computer Science and IT with a focus on networking and cybersecurity gave me a foundational appreciation for how interconnected systems function—and where they break.",
          "In cybersecurity, you learn that vulnerabilities rarely appear in the center of a well-trodden process; they emerge at the handoffs, the edge cases, and the gaps where communication breaks down. The exact same rule applies to business operations and sales funnels.",
          "When a business struggles to convert leads or scale its brand, the bottleneck is almost always an unaddressed operational edge case. Having an IT mindset allows me to analyze commercial problems with structured logic, ensuring that marketing promises align with operational capability."
        ]
      }
    ];

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    window.copyEmail = function() {
      navigator.clipboard.writeText('hello@rojish-sakhakarmi.com.np').then(() => {
        showToast('hello@rojish-sakhakarmi.com.np copied to clipboard!');
      });
    };

    // Theme Toggle
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeText = document.getElementById('theme-text');

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeText.textContent = 'Light';
      } else {
        document.documentElement.removeAttribute('data-theme');
        themeText.textContent = 'Dark';
      }
    }

    themeToggleBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

    applyTheme(localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

    // Shared Band
    function renderSharedContactBand() {
      return `
        <section class="shared-contact-band">
          <div>
            <span class="font-mono" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle);">Direct line //</span>
            <h2 style="font-size: 24px; font-weight: 600; margin-top: 4px;">Let's talk about ideas worth building.</h2>
            <p style="font-size: 14px; color: var(--text-muted); margin-top: 4px;">Business development, brand strategy, creative direction, or financial markets. Send a note and I will reply personally.</p>
          </div>
          <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
            <a href="#contact" class="btn btn-solid">Initiate conversation →</a>
            <button class="btn btn-outline" onclick="copyEmail()">Copy email</button>
          </div>
        </section>
      `;
    }

    // 1. HOME VIEW
    function renderHome() {
      const postRows = BLOG_POSTS.slice(0, 3).map(post => `
        <div class="post-row" onclick="location.hash='#post/${escapeHtml(post.slug)}'">
          <div class="post-date">${escapeHtml(post.date)}</div>
          <div>
            <h3 class="post-title">${escapeHtml(post.title)}</h3>
            <p class="post-summary">${escapeHtml(post.excerpt)}</p>
          </div>
          <div>
            <span class="category-chip">${escapeHtml(post.category)}</span>
          </div>
        </div>
      `).join('');

      return `
        <section class="hero-section">
          <div class="hero-grid">
            <div>
              <div class="pill">
                <span class="pulse-dot"></span>
                <span>Based in Bhaktapur, Nepal • Open to BD Roles</span>
              </div>

              <div class="hero-headline-wrap">
                <span>Where strategy, creativity,</span>
                <span>and communication meet.</span>

                  RS
                </div>
                <div style="font-weight: 600; font-size: 15px;">Rojish Sakhakarmi</div>
                <div class="font-mono" style="font-size: 12px; color: var(--text-subtle); margin-top: 2px;">Business Development Officer</div>
                <div class="font-mono" style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">Bhaktapur, Nepal</div>

                <div class="font-mono" style="margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px; text-align: left; display: flex; flex-direction: column; gap: 8px;">
                  <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--text-subtle);">Focus</span>
                    <span>Business Development</span>
                  </div>
                  <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--text-subtle);">Creative</span>
                    <span>Graphic Design & Brand</span>
                  </div>
                  <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--text-subtle);">Markets</span>
                    <span>Forex & Stock Educator</span>
                  </div>
                  <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--text-subtle);">Education</span>
                    <span>BCS.IT (KFA)</span>
                  </div>
                  <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--text-subtle);">Status</span>
                    <span style="color: #10b981;">Available for Roles</span>
                  </div>
                </div>

                <div style="margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--border);">
                  <a href="mailto:hello@rojish-sakhakarmi.com.np" class="font-mono" style="font-size: 11px; color: var(--text-subtle); text-decoration: underline;">
                    hello@rojish-sakhakarmi.com.np
                  </a>
                </div>
              </div>
            </div>
          </div>
        </article>

        ${renderSharedContactBand()}
      `;
    }

    // 4. BLOG VIEW
    let currentCategory = "All";
    let currentSearch = "";

    function renderBlog() {
      const categories = ["All", ...Array.from(new Set(BLOG_POSTS.map(p => p.category)))];
      const filtered = BLOG_POSTS.filter(post => {
        const matchesCat = currentCategory === "All" || post.category === currentCategory;
        const q = currentSearch.toLowerCase().trim();
        return matchesCat && (!q || post.title.toLowerCase().includes(q) || post.excerpt.toLowerCase().includes(q) || post.body.join(' ').toLowerCase().includes(q));
      });

      const chips = categories.map(cat => `
        <button class="pill ${cat === currentCategory ? 'font-mono' : ''}" style="${cat === currentCategory ? 'background: var(--text); color: var(--bg);' : ''}" onclick="setBlogCategory('${escapeHtml(cat)}')">
          ${escapeHtml(cat)}
        </button>
      `).join('');

      const postRows = filtered.length === 0 ? `<div style="padding: 48px 0; text-align: center; color: var(--text-muted); font-size: 13px;" class="font-mono">No notes match that yet.</div>` : filtered.map(post => `
        <div class="post-row" onclick="location.hash='#post/${escapeHtml(post.slug)}'">
          <div class="post-date">${escapeHtml(post.date)}</div>
          <div>
            <h3 class="post-title">${escapeHtml(post.title)}</h3>
            <p class="post-summary">${escapeHtml(post.excerpt)}</p>
          </div>
          <div>
            <span class="category-chip">${escapeHtml(post.category)}</span>
          </div>
        </div>
      `).join('');

      return `
        <section class="section-spacing">
          <div class="section-title">
            <div>
              <span>Writing & Notes</span>
              <p style="font-size: 14px; font-weight: 400; color: var(--text-muted); margin-top: 4px;">Thoughts on business development, brand strategy, graphic design, financial markets, and systems.</p>
            </div>
            <span class="font-mono" style="font-size: 11px; text-transform: uppercase; color: var(--text-subtle);">[ ${BLOG_POSTS.length} ARTICLES ]</span>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;">
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">${chips}</div>
            <input type="search" placeholder="Search notes..." value="${escapeHtml(currentSearch)}" oninput="handleSearch(this.value)" class="form-input font-mono" style="width: 220px; padding: 6px 12px; font-size: 12px; border-radius: 9999px;" />
          </div>

          <div>${postRows}</div>
        </section>

        ${renderSharedContactBand()}
      `;
    }

    window.setBlogCategory = function(cat) {
      currentCategory = cat;
      document.getElementById('app').innerHTML = renderBlog();
    };

    window.handleSearch = function(val) {
      currentSearch = val;
      document.getElementById('app').innerHTML = renderBlog();
    };

    // 5. POST VIEW
    function renderPost(slug) {
      const post = BLOG_POSTS.find(p => p.slug === slug);
      if (!post) {
        return `
          <div class="section-spacing" style="text-align: center;">
            <h1 style="font-size: 24px; margin-bottom: 12px;">Article not found</h1>
            <a href="#blog" class="btn btn-solid">Back to writing</a>
          </div>
        `;
      }
      const idx = BLOG_POSTS.indexOf(post);
      const nextPost = BLOG_POSTS[(idx + 1) % BLOG_POSTS.length];

      return `
        <article style="max-width: 700px; margin: 0 auto; padding: 48px 0 64px 0;">
          <a href="#blog" class="font-mono" style="font-size: 12px; text-transform: uppercase; color: var(--text-subtle); display: inline-flex; align-items: center; gap: 6px; margin-bottom: 24px;">← Back to writing</a>
          <h1 style="font-size: clamp(28px, 4vw, 42px); font-weight: 600; line-height: 1.15; margin-bottom: 12px;">${escapeHtml(post.title)}</h1>
          <div class="font-mono" style="font-size: 12px; color: var(--text-subtle); padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 28px;">
            ${escapeHtml(post.category)} / ${escapeHtml(post.date)} / Rojish Sakhakarmi
          </div>
          <div style="font-size: 17px; line-height: 1.7; display: flex; flex-direction: column; gap: 20px;">
            ${post.body.map(p => `<p>${escapeHtml(p)}</p>`).join('')}
          </div>
          ${post.category.includes('Market') ? `<div style="margin: 24px 0; padding-left: 14px; border-left: 2px solid var(--border); font-size: 13px; font-style: italic; color: var(--text-subtle);">Note: This reflects personal market experience, not financial advice.</div>` : ''}
          <div style="margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end;">
            <a href="#post/${escapeHtml(nextPost.slug)}" class="btn btn-outline font-mono" style="font-size: 12px;">Next: ${escapeHtml(nextPost.title)} →</a>
          </div>
        </article>
      `;
    }

    // Scroll Progress
    window.addEventListener('scroll', () => {
      if (window.location.hash.startsWith('#post/')) {
        const total = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        document.getElementById('progress-bar').style.width = (total > 0 ? (window.scrollY / total) * 100 : 0) + '%';
      } else {
        document.getElementById('progress-bar').style.width = '0%';
      }
    });

    // Router
    function handleRoute() {
      const hash = window.location.hash || '#';
      const app = document.getElementById('app');

      document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));

      window.scrollTo(0, 0);

      if (hash === '#about') {
        document.getElementById('nav-about').classList.add('active');
        app.innerHTML = renderAbout();
        document.title = "About — Rojish Sakhakarmi";
      } else if (hash === '#blog') {
        document.getElementById('nav-blog').classList.add('active');
        app.innerHTML = renderBlog();
        document.title = "Writing — Rojish Sakhakarmi";
      } else if (hash === '#contact') {
        document.getElementById('nav-contact').classList.add('active');
        app.innerHTML = renderContact();
        document.title = "Contact — Rojish Sakhakarmi";
      } else if (hash.startsWith('#post/')) {
        const slug = hash.replace('#post/', '');
        app.innerHTML = renderPost(slug);
        const p = BLOG_POSTS.find(x => x.slug === slug);
        document.title = p ? `${p.title} — Rojish Sakhakarmi` : "Article — Rojish Sakhakarmi";
      } else {
        app.innerHTML = renderHome();
        document.title = "Rojish Sakhakarmi — Business Development & Strategy";
      }
    }

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('DOMContentLoaded', handleRoute);
  </script>
</body>
</html>
